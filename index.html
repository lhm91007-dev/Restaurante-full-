<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cantina Ruta — Pide y sigue tu entrega en vivo</title>
<meta name="description" content="Pide en línea y sigue tu entrega en tiempo real en el mapa.">

<!-- ===================== VISTA PREVIA EN REDES SOCIALES (Open Graph) ===================== -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Cantina Ruta">
<meta property="og:title" content="Cantina Ruta — Pide y sigue tu entrega en vivo">
<meta property="og:description" content="Pide en línea y sigue tu entrega en tiempo real en el mapa.">
<meta property="og:url" content="https://lhm91007-dev.github.io/Restaurante-full-/">
<meta property="og:image" content="https://lhm91007-dev.github.io/Restaurante-full-/images/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<!-- Twitter / X -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Cantina Ruta — Pide y sigue tu entrega en vivo">
<meta name="twitter:description" content="Pide en línea y sigue tu entrega en tiempo real en el mapa.">
<meta name="twitter:image" content="https://lhm91007-dev.github.io/Restaurante-full-/images/og-image.png">

<!-- Ícono de la app (favicon + pantalla de inicio en celular) -->
<link rel="icon" type="image/png" sizes="512x512" href="images/icon-512.png">
<link rel="apple-touch-icon" href="images/icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===================== NAV ===================== -->
<header class="topbar">
  <div class="topbar__inner">
    <a href="#/inicio" class="brand">
      <span class="brand__mark">CR</span>
      <span class="brand__name">Cantina Ruta</span>
    </a>

    <nav class="mainnav" id="mainnav">
      <a href="#/inicio" data-route="inicio">Inicio</a>
      <a href="#/menu" data-route="menu">Menú</a>
      <a href="#/pedidos" data-route="pedidos">Mis pedidos</a>
      <a href="#/cocina" data-route="cocina">Panel cocina</a>
    </nav>

    <div class="topbar__actions">
      <button class="btn btn--ghost" id="btn-cart" aria-label="Abrir carrito">
        🛒 <span id="cart-count" class="badge">0</span>
      </button>
      <button class="hamburger" id="btn-menu-toggle" aria-label="Abrir menú">☰</button>
    </div>
  </div>
</header>

<main id="app"></main>

<!-- ===================== PLANTILLAS (rellenadas por JS) ===================== -->

<template id="tpl-inicio">
  <section class="hero">
    <div class="hero__route" aria-hidden="true">
      <span class="hero__pin hero__pin--start">🍳</span>
      <svg class="route-line route-line--hero" viewBox="0 0 600 40" preserveAspectRatio="none">
        <path d="M10,20 Q150,-10 300,20 T590,20" />
      </svg>
      <span class="hero__pin hero__pin--end">🏠</span>
    </div>
    <p class="eyebrow">Cocina de mercado · Entrega en vivo</p>
    <h1 class="hero__title">De nuestro comal a tu puerta,<br>sin perderle la pista al camino.</h1>
    <p class="hero__lead">Pide tus platillos favoritos y sigue cada parada de tu entrega en un mapa en tiempo real, desde que sale la cocina hasta que toca tu puerta.</p>
    <div class="hero__cta">
      <a href="#/menu" class="btn btn--primary">Ver el menú</a>
      <a href="#/pedidos" class="btn btn--outline">Rastrear un pedido</a>
    </div>
    <ul class="hero__stats">
      <li><strong id="stat-tiempo">--</strong><span>min. promedio</span></li>
      <li><strong id="stat-envio">--</strong><span>envío estándar</span></li>
      <li><strong>4.8★</strong><span>calificación</span></li>
    </ul>
  </section>

  <section class="section section--why">
    <h2 class="section__title">Por qué pedir aquí</h2>
    <div class="why-grid">
      <article class="why-card">
        <span class="why-card__icon">📍</span>
        <h3>Rastreo real en el mapa</h3>
        <p>Ve el punto de tu repartidor moverse en vivo, con hora estimada de llegada actualizada.</p>
      </article>
      <article class="why-card">
        <span class="why-card__icon">🧾</span>
        <h3>Pedido claro, sin sorpresas</h3>
        <p>Total, envío y tiempo estimado antes de confirmar. Sin cargos ocultos.</p>
      </article>
      <article class="why-card">
        <span class="why-card__icon">🔔</span>
        <h3>Estatus paso a paso</h3>
        <p>Recibido → En preparación → En camino → Entregado, notificado en cada parada.</p>
      </article>
    </div>
  </section>

  <section class="section section--preview">
    <h2 class="section__title">Lo más pedido</h2>
    <div id="destacados" class="menu-grid"></div>
    <a href="#/menu" class="btn btn--outline" style="margin-top:2rem;">Ver menú completo</a>
  </section>
</template>

<template id="tpl-menu">
  <section class="section section--menu-header">
    <h1 class="page-title">Menú</h1>
    <p class="page-sub">Cada sección es una parada de la ruta: empieza, sirve fuerte y termina dulce.</p>
    <div class="menu-controls">
      <input type="search" id="menu-search" placeholder="Buscar un platillo…" aria-label="Buscar platillo">
      <div class="chip-row" id="menu-filters"></div>
    </div>
  </section>
  <section class="section" id="menu-categories"></section>
</template>

<template id="tpl-pedidos">
  <section class="section">
    <h1 class="page-title">Mis pedidos</h1>
    <p class="page-sub">Los pedidos hechos desde este navegador aparecen aquí.</p>
    <div id="lista-pedidos" class="orders-list"></div>
  </section>
</template>

<template id="tpl-checkout">
  <section class="section section--checkout">
    <h1 class="page-title">Confirmar pedido</h1>
    <div class="checkout-grid">
      <form id="form-checkout" class="checkout-form">
        <h2>Datos de entrega</h2>
        <label>Nombre completo
          <input type="text" name="nombre" required placeholder="Tu nombre">
        </label>
        <label>Teléfono
          <input type="tel" name="telefono" required placeholder="8 dígitos" pattern="[0-9+\-() ]{7,20}">
        </label>
        <label>Dirección de entrega
          <input type="text" name="direccion" required placeholder="Provincia, distrito, señas">
        </label>

        <button type="button" id="btn-geoloc" class="btn btn--outline btn--small">📍 Usar mi ubicación actual para el mapa</button>
        <p class="hint" id="geoloc-status"></p>

        <h2>Método de pago</h2>
        <div class="pay-options" role="radiogroup" aria-label="Método de pago">
          <label class="pay-option">
            <input type="radio" name="pago" value="efectivo" checked> Efectivo contra entrega
          </label>
          <label class="pay-option">
            <input type="radio" name="pago" value="tarjeta"> Tarjeta contra entrega
          </label>
        </div>

        <label>Notas para el repartidor (opcional)
          <textarea name="notas" rows="2" placeholder="Ej. tocar el timbre, sin cebolla…"></textarea>
        </label>

        <button type="submit" class="btn btn--primary btn--block">Confirmar y rastrear pedido</button>
      </form>

      <aside class="checkout-summary" id="checkout-summary"></aside>
    </div>
  </section>
</template>

<template id="tpl-tracking">
  <section class="section section--tracking">
    <div class="tracking-head">
      <h1 class="page-title">Pedido <span id="tk-id"></span></h1>
      <p class="page-sub">Actualiza en vivo — puedes dejar esta pantalla abierta.</p>
    </div>

    <div class="tracking-layout">
      <div class="tracking-map-wrap">
        <div id="tracking-map"></div>
        <div class="eta-pill">
          <span class="eta-pill__label">Llega en</span>
          <span class="eta-pill__value" id="tk-eta">-- min</span>
        </div>
      </div>

      <aside class="tracking-panel">
        <ol class="status-timeline" id="tk-timeline">
          <li data-status="recibido"><span class="dot"></span><div><strong>Pedido recibido</strong><time></time></div></li>
          <li data-status="preparando"><span class="dot"></span><div><strong>En preparación</strong><time></time></div></li>
          <li data-status="camino"><span class="dot"></span><div><strong>En camino</strong><time></time></div></li>
          <li data-status="entregado"><span class="dot"></span><div><strong>Entregado</strong><time></time></div></li>
        </ol>

        <div class="tracking-details">
          <h3>Resumen</h3>
          <ul id="tk-items" class="tk-items"></ul>
          <div class="tk-total-row"><span>Total</span><strong id="tk-total"></strong></div>
          <p class="tk-address">📍 <span id="tk-address"></span></p>
          <p class="hint">Comparte esta pestaña o el enlace de esta página para que alguien más vea el mismo rastreo en este navegador.</p>
        </div>
      </aside>
    </div>
  </section>
</template>

<template id="tpl-cocina">
  <section class="section">
    <div class="tracking-head">
      <h1 class="page-title">Panel de cocina</h1>
      <p class="page-sub">Vista interna para actualizar el estatus de los pedidos entrantes.</p>
    </div>
    <div id="cocina-lista" class="kitchen-list"></div>
  </section>
</template>

<template id="tpl-404">
  <section class="section" style="text-align:center; padding:6rem 1rem;">
    <h1 class="page-title">Esa parada no existe</h1>
    <p class="page-sub">Regresa al inicio para continuar.</p>
    <a href="#/inicio" class="btn btn--primary">Volver al inicio</a>
  </section>
</template>

<!-- ===================== CARRITO (panel lateral) ===================== -->
<aside class="cart-drawer" id="cart-drawer" aria-hidden="true">
  <div class="cart-drawer__head">
    <h2>Tu pedido</h2>
    <button id="btn-cart-close" aria-label="Cerrar carrito">✕</button>
  </div>
  <div id="cart-items" class="cart-items"></div>
  <div class="cart-drawer__footer">
    <div class="cart-line"><span>Subtotal</span><strong id="cart-subtotal">$0</strong></div>
    <div class="cart-line"><span>Envío</span><strong id="cart-envio">$0</strong></div>
    <div class="cart-line cart-line--total"><span>Total</span><strong id="cart-total">$0</strong></div>
    <button class="btn btn--primary btn--block" id="btn-checkout">Ir a confirmar pedido</button>
  </div>
</aside>
<div class="scrim" id="scrim"></div>

<div class="toast" id="toast"></div>

<footer class="footer">
  <p><strong id="foot-nombre"></strong> · <span id="foot-direccion"></span></p>
  <p class="hint">Demo funcional — pensado para publicarse tal cual en Mulltidigitalcr.</p>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/tracking.js"></script>
</body>
</html>
